<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-login-gradient {
            background: linear-gradient(135deg, #1E293B 0%, #134E4A 100%);
        }

<body class="bg-login-gradient min-h-screen flex items-center justify-center font-body-base text-on-surface p-page-padding">
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Logo and Branding Section -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-16 h-16 bg-white rounded-xl flex items-center justify-center mb-4 shadow-lg">
<span class="material-symbols-outlined text-[40px] text-primary" data-icon="payments">payments</span>
</div>
<h1 class="font-page-title text-page-title text-white mb-1">Office Expense Manager</h1>
<p class="font-label-medium text-label-medium text-tertiary-fixed opacity-90">Management System</p>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-8 shadow-2xl border border-outline-variant/10">
<form class="space-y-6">
<!-- Username Field -->
<div>
<label class="block font-label-medium text-label-medium text-secondary mb-2" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="person">person</span>
<input class="w-full h-10 pl-10 pr-4 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline-variant bg-surface" id="username" placeholder="admin or rashed" type="text">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-medium text-label-medium text-secondary mb-2" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-10 pl-10 pr-4 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline-variant bg-surface" id="password" placeholder="password" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-white font-section-title text-section-title py-3 rounded-lg shadow-md active:scale-[0.98] transition-all duration-150" type="submit">
                    Login
                </button>
</form>
</div>
<!-- Demo Credentials Box -->
<div class="mt-8 w-full bg-on-background/30 backdrop-blur-sm rounded-lg p-4 border border-white/10">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-tertiary-fixed text-[18px]" data-icon="info">info</span>
<span class="font-label-medium text-label-medium text-white">Demo Credentials</span>
</div>
<div class="space-y-2 font-mono text-[12px]">
<div class="flex justify-between items-center text-primary-fixed border-b border-white/5 pb-2">
<span class="font-bold">Admin:</span>
<span>admin / admin123</span>
</div>
<div class="flex justify-between items-center text-primary-fixed pt-1">
<span class="font-bold">Employee:</span>
<span>rashed / 1234</span>
</div>
</div>
</div>
<!-- Decorative Background Image Prompt (Hidden) -->
<div class="hidden">
